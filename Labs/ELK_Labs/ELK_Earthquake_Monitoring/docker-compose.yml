name: elk-earthquake-monitoring

services:
  elasticsearch:
    image: elasticsearch:7.16.2
    container_name: elk-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - elk

  logstash:
    image: logstash:7.16.2
    container_name: elk-logstash
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      # One worker: with many workers the fingerprint filter can crash while lazily loading OpenSSL
      PIPELINE_WORKERS: "1"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logs:/logs:ro
      - ./data:/data:ro
      - ./logstash/templates:/usr/share/logstash/templates:ro
    ports:
      - "9600:9600"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk

  kibana:
    image: kibana:7.16.2
    container_name: elk-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_OPTIN: "false"
      XPACK_SECURITY_SHOWINSECURECLUSTERWARNING: "false"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk

volumes:
  elastic_data:

networks:
  elk:
