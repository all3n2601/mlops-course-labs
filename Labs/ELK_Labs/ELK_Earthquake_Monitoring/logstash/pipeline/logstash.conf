input {
  # The 2025 USGS earthquake catalog, one CSV row per event
  file {
    path => "/data/usgs_earthquakes_2025.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "quake"
  }

  # Plain-text logs written by ml_pipeline.py, parsed with grok below
  file {
    path => "/logs/training.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "training"
  }
  file {
    path => "/logs/drift.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    type => "drift"
  }
}

filter {
  # Hash of the raw line becomes the document id, so re-reading a file overwrites
  # documents instead of duplicating them (sincedb_path is /dev/null, so every
  # Logstash restart re-reads all files).
  fingerprint {
    source => "message"
    target => "[@metadata][doc_id]"
    method => "SHA1"
  }

  if [type] == "quake" {
    if [message] =~ /^time,/ { drop {} }   # header row

    csv {
      columns => ["time", "latitude", "longitude", "depth", "mag", "magType", "nst",
                  "gap", "dmin", "rms", "place", "status"]
      skip_empty_columns => true
      remove_field => ["message"]
    }
    mutate {
      convert => {
        "latitude" => "float"  "longitude" => "float"  "depth" => "float"
        "mag" => "float"  "nst" => "integer"  "gap" => "float"
        "dmin" => "float"  "rms" => "float"
      }
    }
    date {
      match => [ "time", "ISO8601" ]
      target => "@timestamp"
    }
    # geo_point needs a {lat, lon} object so Kibana can draw the map
    mutate {
      rename => { "latitude" => "[location][lat]"  "longitude" => "[location][lon]" }
    }
    if [mag] >= 4.5 {
      mutate { add_field => { "mag_class" => "M4.5+" } }
    } else {
      mutate { add_field => { "mag_class" => "below M4.5" } }
    }
  }

  if [type] in ["training", "drift"] {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} - %{LOGLEVEL:log_level} - %{GREEDYDATA:log_message}" }
    }
  }

  if [type] == "training" {
    grok {
      match => { "log_message" => "Training run %{NUMBER:run:int} finished \| %{GREEDYDATA:kvpairs}" }
      tag_on_failure => []
    }
    date {
      match => [ "log_timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }

  if [type] == "drift" {
    grok {
      match => { "log_message" => "(?i)batch %{NUMBER:batch:int} week (?<week>\d{4}-\d{2}-\d{2}) \| %{GREEDYDATA:kvpairs}" }
      tag_on_failure => []
    }
    if "Data drift detected" in [log_message] {
      mutate { add_field => { "drift" => "true" } }
    }
    # Use the week the data comes from as the event time, so Kibana shows the real 2025 timeline
    if [week] {
      date {
        match => [ "week", "yyyy-MM-dd" ]
        target => "@timestamp"
      }
    }
  }

  if [kvpairs] {
    kv {
      source => "kvpairs"
      field_split_pattern => " \| "
      value_split => ":"
      trim_key => " "
      trim_value => " "
    }
    mutate {
      convert => {
        "val_f1" => "float"  "val_precision" => "float"  "val_recall" => "float"
        "val_fpr" => "float"  "val_fnr" => "float"
        "events" => "integer"  "f1" => "float"  "mean_mag" => "float"
        "ks_stat" => "float"  "p_value" => "float"  "share_m45" => "float"
      }
      remove_field => ["kvpairs"]
    }
  }
}

output {
  if [type] == "quake" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "earthquakes"
      document_id => "%{[@metadata][doc_id]}"
      manage_template => true
      template => "/usr/share/logstash/templates/earthquakes-template.json"
      template_name => "earthquakes"
      template_overwrite => true
    }
  }
  if [type] == "training" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "ml-training"
      document_id => "%{[@metadata][doc_id]}"
      manage_template => true
      template => "/usr/share/logstash/templates/ml-template.json"
      template_name => "ml-logs"
      template_overwrite => true
    }
  }
  if [type] == "drift" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "ml-drift"
      document_id => "%{[@metadata][doc_id]}"
      manage_template => true
      template => "/usr/share/logstash/templates/ml-template.json"
      template_name => "ml-logs"
      template_overwrite => true
    }
  }
}
